<title>2026학년도 2학기 AITP 장학생 조회</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --text: #1b2430; --muted: #5f6b7a;
    --line: #dde3ea; --accent: #1f4e9c; --accent-text: #ffffff;
    --ok-bg: #eaf3ff; --ok-line: #b9d4f5; --no-bg: #fff4f2; --no-line: #f2c4bb; --no-text: #9a2b1a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12161c; --card: #1b2129; --text: #e6ebf1; --muted: #9aa6b4;
      --line: #2e3742; --accent: #5b8fe0; --accent-text: #0d1117;
      --ok-bg: #172a44; --ok-line: #2c4b75; --no-bg: #3a1d19; --no-line: #6b3329; --no-text: #f2a597;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5; word-break: keep-all;
  }
  main { max-width: 440px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 1.35rem; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: .92rem; margin: 0 0 24px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 22px; }
  label { display: block; font-size: .9rem; font-weight: 600; margin: 0 0 6px; }
  .hint { font-weight: 400; color: var(--muted); }
  input {
    width: 100%; font-size: 1rem; padding: 11px 12px; margin: 0 0 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    width: 100%; font-size: 1rem; font-weight: 600; padding: 12px; border: 0; border-radius: 8px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button:disabled { opacity: .6; cursor: wait; }
  #result { margin-top: 18px; }
  .box { border-radius: 10px; padding: 16px 18px; border: 1px solid; }
  .ok { background: var(--ok-bg); border-color: var(--ok-line); }
  .no { background: var(--no-bg); border-color: var(--no-line); color: var(--no-text); }
  .box h2 { font-size: 1.05rem; margin: 0 0 10px; }
  .row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--ok-line); }
  .row:first-of-type { border-top: 0; }
  .amt { font-weight: 700; white-space: nowrap; }
  .total { font-weight: 700; }
  .box p { margin: 0; }
  .box p + p { margin-top: 6px; font-size: .88rem; }
  footer { color: var(--muted); font-size: .82rem; margin-top: 18px; text-align: center; }
</style>
</head>

const $ = (id) => document.getElementById(id);
const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, "0")).join("");
const won = (n) => n.toLocaleString("ko-KR") + "원";
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// build.py 의 norm_name / norm_birth / norm_id 와 동일해야 함
const normName = (v) => v.replace(/\s+/g, "").normalize("NFC").toUpperCase();
const normBirth = (v) => { const d = v.replace(/\D/g, ""); return d.length === 8 ? d.slice(2) : d; };
const normId = (v) => v.replace(/\D/g, "");

async function lookup(name, birth, sid) {
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(`${name}|${birth}|${sid}`), "PBKDF2", false, ["deriveBits"]);
  const km = new Uint8Array(await crypto.subtle.deriveBits(
    { name: "PBKDF2", hash: "SHA-256", salt: b64(DATA.salt), iterations: DATA.iter }, base, 512));
  const rec = DATA.records[hex(km.slice(0, 16))];
  if (!rec) return null;
  const blob = b64(rec);
  const key = await crypto.subtle.importKey("raw", km.slice(32), "AES-GCM", false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: blob.slice(0, 12) }, key, blob.slice(12));
  return JSON.parse(new TextDecoder().decode(pt));
}

function show(html) { $("result").innerHTML = html; }

$("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!window.crypto || !crypto.subtle) {
    show('<div class="box no"><p>이 브라우저에서는 조회할 수 없습니다. 최신 Chrome·Edge·Safari로 접속해 주세요.</p></div>');
    return;
  }
  const btn = $("btn");
  btn.disabled = true; btn.textContent = "조회 중…"; show("");
  try {
    const r = await lookup(normName($("name").value), normBirth($("birth").value), normId($("sid").value));
    if (!r) {
      show('<div class="box no"><p><strong>장학금 수혜 대상자가 아닙니다.</strong></p>' +
           '<p>입력하신 이름·생년월일·학번이 정확한지 다시 확인해 주세요.</p></div>');
      return;
    }
    const rows = r.items.map((i) =>
      `<div class="row"><span>${esc(i.field)}</span><span class="amt">${won(i.amount)}</span></div>`).join("");
    const total = r.items.length > 1
      ? `<div class="row total"><span>합계</span><span class="amt">${won(r.items.reduce((a, i) => a + i.amount, 0))}</span></div>` : "";
    show(`<div class="box ok"><h2>${esc(r.name)} (${esc(r.sid)}) 님은 장학생으로 선정되었습니다</h2>${rows}${total}</div>`);
  } catch (err) {
    show('<div class="box no"><p>조회 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.</p></div>');
  } finally {
    btn.disabled = false; btn.textContent = "조회하기";
  }
});
</script>
